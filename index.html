<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テーブルゲーム</title>
  <link rel="icon" href="assets/logo-dice.svg?v=2">
  <link rel="stylesheet" href="style.css?v=8">
  <link rel="stylesheet" href="theme.css?v=3">
  <link rel="stylesheet" href="hub.css?v=3">
  <script>
    // 以前の将棋の招待リンク（index.html?room=...）は将棋のページへ回す
    if (new URLSearchParams(location.search).has('room')) {
      location.replace('shogi.html' + location.search);
    }
  </script>
</head>
<body>
  <main class="hub">
    <header class="hub-head">
      <h1><img class="logo" src="assets/logo-dice.svg?v=2" alt="">テーブルゲーム</h1>
      <p>リンクを送れば、友だちとすぐ遊べます。</p>
    </header>

    <div class="game-list">
      <a class="game-card" href="shogi.html">
        <div class="game-art art-shogi" aria-hidden="true">
          <i class="shogi-piece opp">飛</i>
          <i class="shogi-piece">王</i>
          <i class="shogi-piece">金</i>
        </div>
        <div class="game-body">
          <h2>将棋</h2>
          <p>招待リンクで1対1。観戦とチャットもできます。待ったあり。</p>
          <span class="meta">2人 ・ 1台で交代もOK</span>
        </div>
      </a>

      <a class="game-card" href="mole.html">
        <div class="game-art art-mole" aria-hidden="true"><img src="assets/mole.svg?v=2" alt=""></div>
        <div class="game-body">
          <h2>モグラたたき</h2>
          <p>モグラ役と叩く役に分かれて対戦。フェイントで相手を釣るのがコツ。</p>
          <span class="meta">2人 ・ CPUとも遊べます</span>
        </div>
      </a>
    </div>

    <p class="hub-foot">登録なしで遊べます。</p>
  </main>
</body>
</html>
